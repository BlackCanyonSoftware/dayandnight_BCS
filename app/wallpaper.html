<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Day and Night</title>
    <style>
      /* One monitor's surface. No chrome, no scrollbars, nothing selectable or
         draggable - this window sits behind the desktop icons and must behave
         like part of the wallpaper, not like a web page. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: default;
        user-select: none;
        -webkit-user-drag: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="surface"></canvas>
    <script type="module" src="wallpaper.js"></script>
  </body>
</html>

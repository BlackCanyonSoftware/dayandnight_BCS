<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day and Night</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <div class="brand">
          <!-- The symbol and the name, as the brand kit's own header template
               arranges them. Both are the files the kit built, not type set in
               CSS, so the application and the brand cannot drift apart. The
               paths keep the kit's folder shape because its stylesheets reach
               their neighbours as ../mark/ and ../font/, and a copy that
               flattens them is a copy `brandkit check` no longer recognises.
               The name is spoken once: the mark is decorative and the wordmark
               carries the alt text. -->
          <img class="brandmark" src="brand/mark/mark.svg" alt="" aria-hidden="true" />
          <div class="brandtext">
            <img class="wm wmlight" src="brand/wordmark/wordmark-light.svg" alt="Day and Night" />
            <img class="wm wmdark" src="brand/wordmark/wordmark-dark.svg" alt="Day and Night" />
          </div>
        </div>

        <div class="topbar">
          <button id="saveBtn" class="ghost" title="Download these settings as a .json file">
            Save
          </button>
          <button id="loadBtn" class="ghost" title="Load a settings .json">Load</button>
          <button id="resetBtn" class="ghost" title="Put every control back to its default">
            Reset
          </button>
          <button id="undoBtn" class="ghost" title="Undo the last change (Ctrl+Z)" disabled>
            Undo
          </button>
          <button id="redoBtn" class="ghost" title="Put it back (Ctrl+Y)" disabled>Redo</button>
          <span style="flex: 1 1 auto"></span>
          <button
            id="themeBtn"
            class="ghost iconbtn"
            title="Light, dark, or follow Windows"
            aria-label="Switch theme"
          >
            <svg
              viewBox="0 0 16 16"
              width="14"
              height="14"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle class="ico-sun" cx="8" cy="8" r="3.2" />
              <g class="ico-sun">
                <path
                  d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M13 3l-1.1 1.1M4.1 11.9 3 13"
                />
              </g>
              <path
                class="ico-moon"
                d="M13 9.6A5.6 5.6 0 0 1 6.4 3a5.6 5.6 0 1 0 6.6 6.6Z"
                hidden
              />
            </svg>
          </button>
        </div>

        <div id="panels">
          <details class="sec" open>
            <summary>Look</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span id="lookLabel">Preset</span
                    ><span
                      class="info"
                      id="lookHint"
                      tabindex="0"
                      data-tip="A complete look, laid over the defaults. Where you are and how often the wallpaper redraws are not part of it, so switching never moves your sky or changes what it costs. Change any control afterwards and this returns to Custom. Every picture is the same June morning, so the looks can be compared with each other rather than with your sky."
                      >i</span
                    ></span
                  >
                </label>
                <div
                  class="gallery"
                  id="lookGallery"
                  role="radiogroup"
                  aria-labelledby="lookLabel"
                ></div>
              </div>
            </div>
          </details>

          <details class="sec">
            <summary>Share</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>This look as a code</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="A short string carrying everything about how this sky looks and nothing about where you are. Paste one somebody sent you and press Use it; your location, your frame rate and your startup settings are left alone."
                      >i</span
                    ></span
                  >
                </label>
                <textarea id="shareCode" rows="2" spellcheck="false"></textarea>
              </div>

              <div class="row shareactions">
                <button id="shareCopy" class="ghost" type="button">Copy</button>
                <button id="shareApply" class="ghost" type="button">Use it</button>
              </div>

              <div class="row">
                <div class="meta" id="shareNote">&mdash;</div>
              </div>
            </div>
          </details>

          <details class="sec" open>
            <summary>Place</summary>
            <div class="sec-body">
              <div class="row">
                <label for="city">
                  <span class="labelleft"
                    ><span>City</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Type a city or a country to set your coordinates. The list is a hundred or so large cities, accurate to about a tenth of a degree, which puts sunrise within half a minute. If yours is not here, the numbers below take anything."
                      >i</span
                    ></span
                  >
                </label>
                <input
                  id="city"
                  type="text"
                  list="cityList"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Search for a city"
                />
                <datalist id="cityList"></datalist>
              </div>

              <div class="row">
                <button id="guessBtn" class="ghost" type="button">Use my time zone</button>
                <div class="meta" id="guessNote"></div>
              </div>

              <div class="row">
                <label for="latNum">
                  <span class="labelleft"
                    ><span>Latitude</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Degrees north of the equator; negative for the southern hemisphere. This decides how high the sun climbs and how long twilight lasts, so it changes the look of the whole day more than anything else here. Drag to explore, or type for precision."
                      >i</span
                    ></span
                  >
                  <span class="val" id="latVal">0.0&deg;</span>
                </label>
                <div class="rowinline">
                  <input id="lat" type="range" min="-89.9" max="89.9" step="0.1" value="39.7" />
                  <input
                    id="latNum"
                    type="number"
                    min="-89.9"
                    max="89.9"
                    step="0.01"
                    value="39.7"
                    aria-label="Latitude in degrees"
                  />
                </div>
              </div>

              <div class="row">
                <label for="lonNum">
                  <span class="labelleft"
                    ><span>Longitude</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Degrees east of Greenwich; negative for the west. This sets what time the sun is overhead, which is why a city at the eastern edge of a time zone sees noon well before the clock says so. Drag to explore, or type for precision."
                      >i</span
                    ></span
                  >
                  <span class="val" id="lonVal">0.0&deg;</span>
                </label>
                <div class="rowinline">
                  <input id="lon" type="range" min="-180" max="180" step="0.1" value="-105" />
                  <input
                    id="lonNum"
                    type="number"
                    min="-180"
                    max="180"
                    step="0.01"
                    value="-105"
                    aria-label="Longitude in degrees"
                  />
                </div>
              </div>
            </div>
          </details>

          <details class="sec" open>
            <summary>Sky</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Exposure</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How much light reaches the picture, in stops, as on a camera. Negative is darker. Reach for it if the night is too bright to sit behind desktop icons, or the day is washing out."
                      >i</span
                    ></span
                  >
                  <span class="val" id="exposureVal">0.0 EV</span>
                </label>
                <input id="exposure" type="range" min="-3" max="3" step="0.1" value="0" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Haze glow</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How bright something has to be before it burns out to white. Raise it to keep detail in the glow around the sun; lower it for more contrast everywhere else."
                      >i</span
                    ></span
                  >
                  <span class="val" id="whitePointVal">4.0</span>
                </label>
                <input id="whitePoint" type="range" min="1" max="16" step="0.1" value="4" />
              </div>
            </div>
          </details>

          <details class="sec" open>
            <summary>View</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Facing</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Which way the camera points, as a compass bearing. Auto faces the half of the sky the sun crosses, which is south from the northern hemisphere and north from the southern. Turn it yourself to put the sunrise where you want it on screen."
                      >i</span
                    ></span
                  >
                  <span class="val" id="bearingVal">Auto</span>
                </label>
                <input id="bearing" type="range" min="-1" max="359" step="1" value="-1" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Horizon</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How far down the screen the horizon sits. Low leaves more sky, which is usually what you want behind desktop icons; high brings the warm band at the horizon into the middle of the picture."
                      >i</span
                    ></span
                  >
                  <span class="val" id="horizonVal">82%</span>
                </label>
                <input id="horizon" type="range" min="0.3" max="1.3" step="0.01" value="0.82" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Field of view</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How much sky the whole span covers, left to right. The sun swings through about 180 degrees between rising and setting, so a narrow view misses it for most of the day. Narrower magnifies whatever you are facing."
                      >i</span
                    ></span
                  >
                  <span class="val" id="fieldOfViewVal">90&deg;</span>
                </label>
                <input id="fieldOfView" type="range" min="30" max="200" step="1" value="150" />
              </div>
            </div>
          </details>

          <details class="sec" open>
            <summary>Grade</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Haze</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How much dust and moisture the air holds. One is an ordinary clear day. More whitens the sky, widens the glare around the sun and mutes the blue - and a deep red sunset is largely a dusty one, so reach for this if sunsets look too polite."
                      >i</span
                    ></span
                  >
                  <span class="val" id="turbidityVal">1.0&times;</span>
                </label>
                <input id="turbidity" type="range" min="0.3" max="5" step="0.05" value="1" />
              </div>

              <div class="rowpair">
                <div class="row">
                  <label
                    ><span class="labelleft"
                      ><span>Day</span
                      ><span
                        class="info"
                        tabindex="0"
                        data-tip="A colour cast applied when the sun is well up. A neutral grey leaves the sky exactly as the physics drew it; anything else tints it without flattening it, because it multiplies light rather than painting over it."
                        >i</span
                      ></span
                    ></label
                  >
                  <input id="dayTint" type="color" value="#808080" />
                </div>
                <div class="row">
                  <label
                    ><span class="labelleft"
                      ><span>Twilight</span
                      ><span
                        class="info"
                        tabindex="0"
                        data-tip="The cast for the hour either side of the horizon - the part of the day this wallpaper is about. Warming it here deepens a sunrise without touching the middle of the day."
                        >i</span
                      ></span
                    ></label
                  >
                  <input id="twilightTint" type="color" value="#808080" />
                </div>
              </div>

              <div class="rowpair">
                <div class="row">
                  <label
                    ><span class="labelleft"
                      ><span>Night</span
                      ><span
                        class="info"
                        tabindex="0"
                        data-tip="The cast once the sun is well down. Cooling it makes a colder, bluer night; warming it suggests a town over the hill."
                        >i</span
                      ></span
                    ></label
                  >
                  <input id="nightTint" type="color" value="#808080" />
                </div>
                <div class="row">
                  <label>
                    <span class="labelleft"
                      ><span>Saturation</span
                      ><span
                        class="info"
                        tabindex="0"
                        data-tip="How strong the colours are, adjusted in a perceptual space so that raising it does not drag hues around the way it does in most software."
                        >i</span
                      ></span
                    >
                    <span class="val" id="saturationVal">1.0</span>
                  </label>
                  <input id="saturation" type="range" min="0" max="2.5" step="0.05" value="1" />
                </div>
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Contrast</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How far apart the light and dark parts are pushed, pivoting about the lightness the eye calls the middle rather than the number halfway between 0 and 255."
                      >i</span
                    ></span
                  >
                  <span class="val" id="contrastVal">1.0</span>
                </label>
                <input id="contrast" type="range" min="0.4" max="2.2" step="0.05" value="1" />
              </div>
            </div>
          </details>

          <details class="sec">
            <summary>Horizon</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>What is out there</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="What stands between you and the horizon. These are drawn rather than photographed, so there is not a library of six of them - there is a library of all of them, and the seed below is how you walk through it."
                      >i</span
                    ></span
                  >
                </label>
                <select id="skyline"></select>
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>How tall</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How high it stands, in degrees. Eight is about a range of hills twenty miles off, or a city seen from across its river. Much past fifteen and it stops being a horizon and starts being a wall."
                      >i</span
                    ></span
                  >
                  <span class="val" id="skylineHeightVal">8°</span>
                </label>
                <input id="skylineHeight" type="range" min="0" max="25" step="0.5" value="8" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Which one</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Changes the shape without changing anything else. Every number is a different ridgeline or a different city, so if you do not like the one you have, take the next."
                      >i</span
                    ></span
                  >
                  <span class="val" id="skylineSeedVal">1</span>
                </label>
                <input id="skylineSeed" type="range" min="0" max="200" step="1" value="1" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Lights</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How brightly a city lights up after dark. They come on a few at a time as the sun goes down, and some are still on at three in the morning. Mountains and trees ignore this, having no windows."
                      >i</span
                    ></span
                  >
                  <span class="val" id="skylineLightsVal">100%</span>
                </label>
                <input id="skylineLights" type="range" min="0" max="1" step="0.01" value="1" />
              </div>
            </div>
          </details>

          <details class="sec">
            <summary>Clouds</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Cover</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How much of the sky has cloud in it. At nothing the whole layer is skipped and a clear sky costs exactly what it did before clouds existed, which is worth knowing if you leave this running all day."
                      >i</span
                    ></span
                  >
                  <span class="val" id="cloudCoverVal">0%</span>
                </label>
                <input id="cloudCover" type="range" min="0" max="1" step="0.01" value="0" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Wind</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How fast they drift. The three layers move at different speeds because they are at different heights, which is what gives the sky depth. Faster also means redrawing more often, so this is the one cloud setting that costs you something."
                      >i</span
                    ></span
                  >
                  <span class="val" id="cloudDriftVal">12 km/h</span>
                </label>
                <input id="cloudDrift" type="range" min="0" max="60" step="1" value="12" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Size</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How large the clouds are, in kilometres. Larger means fewer and bigger. Below about half a kilometre they turn to grain, because the pixels run out before the detail does."
                      >i</span
                    ></span
                  >
                  <span class="val" id="cloudScaleVal">1.6 km</span>
                </label>
                <input id="cloudScale" type="range" min="0.3" max="8" step="0.1" value="1.6" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Edge</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How sharply a cloud ends. Low is fair-weather cumulus with a crisp edge; high is a soft overcast that fades into the sky."
                      >i</span
                    ></span
                  >
                  <span class="val" id="cloudSoftnessVal">0.22</span>
                </label>
                <input
                  id="cloudSoftness"
                  type="range"
                  min="0.02"
                  max="0.6"
                  step="0.01"
                  value="0.22"
                />
              </div>
            </div>
          </details>

          <details class="sec">
            <summary>Sun and moon</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Glare</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How much the sun and moon flare. Both discs are only about half a degree across - a handful of pixels - so the glare is most of what makes the sun read as the sun rather than as a dot."
                      >i</span
                    ></span
                  >
                  <span class="val" id="glareVal">1.0&times;</span>
                </label>
                <input id="glare" type="range" min="0" max="3" step="0.05" value="1" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Disc size</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How much larger than life to draw the sun and moon. One is the truth: both are about half a degree across, which is far smaller than most people remember. Anything above one is a pleasant lie, and the moon&rsquo;s phase is easier to see for it."
                      >i</span
                    ></span
                  >
                  <span class="val" id="bodyScaleVal">1.0&times;</span>
                </label>
                <input id="bodyScale" type="range" min="1" max="8" step="0.1" value="1" />
              </div>
            </div>
          </details>

          <details class="sec" open>
            <summary>Stars</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Brightness</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How bright the stars are. This scales their real relative brightnesses rather than replacing them, so turning it up brings fainter stars out of the dark without flattening the difference between them. They are added to the sky as light, so they vanish in daylight on their own."
                      >i</span
                    ></span
                  >
                  <span class="val" id="starBrightnessVal">1.0&times;</span>
                </label>
                <input id="starBrightness" type="range" min="0" max="4" step="0.05" value="1" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Size</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How large each star is drawn, in pixels. Below about two, a star's peak falls between pixels and the sky dims and shimmers as the stars drift. Larger is softer and more photographic."
                      >i</span
                    ></span
                  >
                  <span class="val" id="starSizeVal">2.6 px</span>
                </label>
                <input id="starSize" type="range" min="1" max="5" step="0.1" value="2.6" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Twinkle</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How much the stars shimmer. Real twinkling is light bending through moving air, so it is strongest near the horizon and almost absent overhead - that part is handled for you whatever this is set to."
                      >i</span
                    ></span
                  >
                  <span class="val" id="twinkleVal">60%</span>
                </label>
                <input id="twinkle" type="range" min="0" max="1" step="0.01" value="0.6" />
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Night sky glow</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="The faint light the night sky has of its own, from airglow high in the atmosphere and from stars too faint to resolve. Raise it to stand in for a town nearby; drop it to nothing for a sky as dark as a desert."
                      >i</span
                    ></span
                  >
                  <span class="val" id="airglowVal">1.1</span>
                </label>
                <input id="airglow" type="range" min="0" max="6" step="0.05" value="1.1" />
              </div>
            </div>
          </details>

          <details class="sec" open>
            <summary>Screens</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Detected</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Every screen Windows reports, and the span - the box that contains all of them. One sky is composed for the span and each screen shows its own slice, which is why the sun crosses from one monitor to the next over the day."
                      >i</span
                    ></span
                  >
                </label>
                <div class="meta" id="monList">&mdash;</div>
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Arrangement</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Your screens as Windows has them placed, drawn to scale. The sky is composed for the box around them all, so a screen sitting on its own leaves sky in the gap that nothing shows. Change the arrangement in Windows display settings and this follows."
                      >i</span
                    ></span
                  >
                </label>
                <div class="monmap" id="monMap"></div>
              </div>

              <div class="row">
                <div class="meta" id="monNote">&mdash;</div>
              </div>
            </div>
          </details>

          <details class="sec">
            <summary>About</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Version</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Which build this is. Worth quoting if you ever report something that looks wrong, because the answer usually depends on it."
                      >i</span
                    ></span
                  >
                  <span class="val" id="aboutVersion">&mdash;</span>
                </label>
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Documents</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="The licence you agreed to, what the application does with your location, and whose work is in it. They ship with every build rather than living on a website, so they are readable with no network and cannot change under you."
                      >i</span
                    ></span
                  >
                </label>
                <div class="legallist" id="legalList"></div>
              </div>
            </div>
          </details>

          <details class="sec">
            <summary>Performance</summary>
            <div class="sec-body">
              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Frame rate</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How often the wallpaper redraws. The goal is never stuttering while you work rather than a high number: a sky has nothing fast in it, and 20 is already generous. Lower it if you want the cost lower."
                      >i</span
                    ></span
                  >
                  <span class="val" id="fpsVal">20 fps</span>
                </label>
                <input id="fps" type="range" min="5" max="30" step="1" value="20" />
              </div>

              <div class="row">
                <label class="check">
                  <input id="startup" type="checkbox" />
                  <span class="labelleft"
                    ><span>Start with Windows</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="Put the sky up when you sign in, without opening this window. The wallpaper is the product; this panel is just where you change it. Windows also lets you turn this off in Task Manager under Startup, and if you do, this box follows."
                      >i</span
                    ></span
                  >
                </label>
              </div>

              <div class="row">
                <label>
                  <span class="labelleft"
                    ><span>Stop when you are away</span
                    ><span
                      class="info"
                      tabindex="0"
                      data-tip="How long without a keystroke or a mouse move before the wallpaper stops drawing, and starts again the moment you come back. Ten minutes is when Windows turns most screens off anyway, so by then there is usually nothing to draw on. Drag it to the left end for never."
                      >i</span
                    ></span
                  >
                  <span class="val" id="awayVal">10 min</span>
                </label>
                <input id="away" type="range" min="0" max="60" step="1" value="10" />
              </div>
            </div>
          </details>
        </div>

        <div id="wallBox">
          <button id="wallBtn" class="primary" type="button">Turn the wallpaper on</button>
          <div id="wallState">Not running.</div>
        </div>

        <footer class="sidefoot">
          <span>Day and Night</span>
          <span>&copy;&nbsp;2026 Black Canyon Software</span>
        </footer>
      </aside>

      <main id="stage">
        <div class="stagebar">
          <button
            id="playBtn"
            class="ghost iconbtn"
            title="Play / pause (space)"
            aria-label="Play or pause"
          >
            &#9208;
          </button>
          <button id="ffBtn" class="ghost" title="Run a whole day in about thirty seconds">
            Fast&nbsp;forward
          </button>
          <button id="nowBtn" class="ghost" title="Snap back to the real time now">Now</button>

          <div class="scrub-wrap">
            <canvas id="scrubBands" width="600" height="18" aria-hidden="true"></canvas>
            <input
              id="scrub"
              type="range"
              min="0"
              max="1439"
              step="1"
              value="720"
              title="Time of day"
              aria-label="Time of day in minutes"
            />
          </div>

          <input id="date" type="date" title="Which date to show" style="width: 140px" />

          <span class="spacer"></span>
          <span class="meta" id="readout">&mdash;</span>
        </div>

        <div id="view">
          <div id="previewWrap">
            <canvas id="preview"></canvas>
            <div id="previewSplits"></div>
          </div>
        </div>

        <div id="notice" hidden></div>

        <div class="stagefoot">
          <span class="meta" id="hostNote">&mdash;</span>
          <span class="meta" id="spanNote">&mdash;</span>
        </div>
      </main>
    </div>

    <script type="module" src="ui/index.js"></script>
    <div class="reader" id="reader" hidden>
      <div
        class="readerbox"
        role="dialog"
        aria-modal="true"
        aria-labelledby="readerTitle"
        tabindex="-1"
      >
        <div class="readerhead">
          <h2 id="readerTitle">Document</h2>
          <button class="ghost" id="readerClose" type="button">Close</button>
        </div>
        <pre class="readertext" id="readerText" tabindex="0"></pre>
      </div>
    </div>
  </body>
</html>
